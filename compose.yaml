services:
  postgres:
    build:
      context: .
      dockerfile: tools/postgres.Dockerfile
    image: ledgerai-postgres:17-local
    environment:
      POSTGRES_DB: ledgerai
      POSTGRES_USER: ledgerai_migrator
      POSTGRES_PASSWORD: local-migration-only
      LEDGERAI_RUNTIME_PASSWORD: local-runtime-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ledgerai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerai_migrator -d ledgerai"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    build:
      context: .
      dockerfile: tools/minio.Dockerfile
      target: server
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ledgerai-minio-local
      MINIO_ROOT_PASSWORD: local-storage-only-change-me
      MINIO_KMS_SECRET_KEY: ledgerai-local-key:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      MINIO_KMS_AUTO_ENCRYPTION: "on"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ledgerai-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    build:
      context: .
      dockerfile: tools/minio.Dockerfile
      target: client
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 ledgerai-minio-local local-storage-only-change-me &&
        mc mb --ignore-existing local/ledgerai-evidence &&
        mc anonymous set none local/ledgerai-evidence &&
        mc version enable local/ledgerai-evidence

  model-runtime:
    image: python:3.12-slim
    working_dir: /workspace
    command: ["uvicorn", "ledgerai_role6.app:create_role6_app", "--factory", "--host", "0.0.0.0", "--port", "8006"]
    environment:
      LEDGERAI_ROLE6_ENVIRONMENT: "development"
      LEDGERAI_ROLE6_ACTIVE_BACKEND: "deterministic"
      LEDGERAI_ROLE6_SERVICE_AUDIENCE: "ledgerai-role6"
      LEDGERAI_ROLE6_SERVICE_TOKEN_SECRET: "local-service-token-secret-32-chars-minimum"
      LEDGERAI_ROLE6_ALLOW_OUTBOUND_NETWORK: "false"
    ports:
      - "127.0.0.1:8006:8006"
    volumes:
      - .:/workspace:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  ledgerai-postgres:
  ledgerai-minio:

