[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerai-backend"
version = "1.2.0"
description = "LedgerAI contracts and secure multi-tenant backend foundation"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.15,<2",
  "boto3>=1.40,<2",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.115,<1",
  "opentelemetry-api>=1.31,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=6.4,<7",
  "sqlalchemy[asyncio]>=2.0.39,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "pip-licenses>=5,<6",
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
ledgerai-seed = "ledgerai_backend.database.seed:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "postgres: requires a real PostgreSQL database",
  "integration_service: requires real Redis or S3-compatible storage",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"src/ledgerai_backend/database/seed.py" = ["E501"]
"src/ledgerai_backend/ingestion/models.py" = ["E501"]
"tests/integration/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ledgerai_contracts", "ledgerai_backend"]

[tool.uv]
package = true

