name: backend

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "src/ledgerai_contracts/**"
      - "src/ledgerai_backend/**"
      - "migrations/**"
      - "shared/schemas/**"
      - "shared/fixtures/**"
      - "shared/openapi/**"
      - "tests/**"
      - "tools/**"
      - "docs/architecture/**"
      - "docs/integration/**"
      - "docs/backend/**"
      - "docs/adr/**"
      - "README.md"
      - ".env.example"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "compose.yaml"
      - ".github/workflows/contracts.yml"
  push:
    branches:
      - main
      - role4/backend-orchestration
    paths:
      - "src/ledgerai_contracts/**"
      - "src/ledgerai_backend/**"
      - "migrations/**"
      - "shared/schemas/**"
      - "shared/fixtures/**"
      - "shared/openapi/**"
      - "tests/**"
      - "tools/**"
      - "docs/architecture/**"
      - "docs/integration/**"
      - "docs/backend/**"
      - "docs/adr/**"
      - "README.md"
      - ".env.example"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - "compose.yaml"
      - ".github/workflows/contracts.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ledgerai
          POSTGRES_USER: ledgerai_migrator
          POSTGRES_PASSWORD: ci-migration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerai_migrator -d ledgerai"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      LEDGERAI_ENVIRONMENT: test
      LEDGERAI_MIGRATION_DSN: postgresql+psycopg://ledgerai_migrator:ci-migration-only@127.0.0.1:5432/ledgerai
      LEDGERAI_DATABASE_DSN: postgresql+psycopg://ledgerai_runtime:ci-runtime-only@127.0.0.1:5432/ledgerai
      LEDGERAI_TEST_ADMIN_DSN: postgresql://ledgerai_migrator:ci-migration-only@127.0.0.1:5432/ledgerai
      LEDGERAI_TEST_RUNTIME_DSN: postgresql://ledgerai_runtime:ci-runtime-only@127.0.0.1:5432/ledgerai
      LEDGERAI_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      LEDGERAI_TEST_STORAGE_ENDPOINT_URL: http://127.0.0.1:9000
      LEDGERAI_TEST_STORAGE_ACCESS_KEY: ledgerai-minio-ci
      LEDGERAI_TEST_STORAGE_SECRET_KEY: ci-storage-only-change-me
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.27"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --all-extras --frozen --python 3.11
      - name: Start Redis and private MinIO
        run: |
          docker run -d --name ledgerai-redis -p 6379:6379 redis:8-alpine redis-server --save "" --appendonly no
          GOBIN="$RUNNER_TEMP" go install github.com/minio/minio@RELEASE.2025-04-22T22-12-26Z
          mkdir -p "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER=ledgerai-minio-ci \
          MINIO_ROOT_PASSWORD=ci-storage-only-change-me \
          MINIO_KMS_SECRET_KEY=ledgerai-ci-key:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= \
          MINIO_KMS_AUTO_ENCRYPTION=on \
            "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 \
            >"$RUNNER_TEMP/minio.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && break
            if [ "$attempt" = 30 ]; then exit 1; fi
            sleep 2
          done
          docker exec ledgerai-redis redis-cli ping | grep PONG
          uv run --frozen python -c "import boto3; c=boto3.client('s3',endpoint_url='http://127.0.0.1:9000',aws_access_key_id='ledgerai-minio-ci',aws_secret_access_key='ci-storage-only-change-me',region_name='us-east-1'); c.create_bucket(Bucket='ledgerai-evidence'); c.put_bucket_versioning(Bucket='ledgerai-evidence',VersioningConfiguration={'Status':'Enabled'})"
      - name: Create non-owner runtime role
        run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -v ON_ERROR_STOP=1 -U ledgerai_migrator -d ledgerai
          -c "CREATE ROLE ledgerai_runtime LOGIN PASSWORD 'ci-runtime-only'
          NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen alembic current
      - run: uv run --frozen alembic heads
      - run: uv run --frozen ledgerai-seed
      - run: uv run --frozen ledgerai-seed
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy src tests tools
      - run: uv run --frozen pip-audit --local --skip-editable --progress-spinner off
      - run: uv run --frozen pip-licenses --summary
      - run: uv run --frozen python tools/generate_contract_artifacts.py --check
      - run: uv run --frozen python tools/generate_openapi.py --check
      - run: uv run --frozen pytest
      - run: uv run --frozen python -m compileall -q src tools tests
